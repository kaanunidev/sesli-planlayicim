<!doctype html>
<!-- Referans tasarım (tasarım tuvalinden çıkarıldı; fontlar Google Fonts üzerinden). -->
<html lang="tr"><head><meta charset="utf-8"><title>Gün sonu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>body{margin:0}
a{color:#1B2420}a:hover{color:#C2461C}</style></head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4EE; color: #1B2420; font-family: 'Figtree', sans-serif; display: flex; flex-direction: column; padding: 56px 24px 32px; gap: 18px">
<div style="background: #2F6F62; color: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 500; color: #D5E6E1">11 Ekim, akşam</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.15; font-weight: 700">4 işten 3'ünü tamamladın</div>
<div style="font-size: 15px; color: #E4F0EC">Güzel bir gündü. Kalanı birlikte ayarlayalım.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 600; color: #5B6560; letter-spacing: 1px">TAMAMLANANLAR</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #E9EBE3">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F6F62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
<span style="font-size: 15px">Kahvaltı ve ilaç</span>
</div>
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #E9EBE3">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F6F62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
<span style="font-size: 15px">Maç izle</span>
</div>
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F6F62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
<span style="font-size: 15px">Market alışverişi</span>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 600; color: #5B6560; letter-spacing: 1px">YAPILAMAYAN</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 17px; font-weight: 600">Annemi ara</div>
<div style="font-size: 13px; color: #5B6560">Yarın da eklemek ister misin?</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex: 1; height: 48px; border-radius: 14px; border: none; background: #C2461C; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Yarına taşı</button>
<button type="button" style="flex: 1; height: 48px; border-radius: 14px; border: 1.5px solid #C9CDC2; background: #FFFFFF; color: #1B2420; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Bırak</button>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #F3F4EE">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"></path></svg>
<span style="font-size: 13px; line-height: 1.4; color: #3F4944">Bu iş 3 gündür erteleniyor. Yarın için belirli bir saat seçmek ister misin?</span>
</div>
</div>
</div>
<div style="margin-top: auto">
<button type="button" style="width: 100%; height: 52px; border-radius: 16px; border: none; background: #1B2420; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Günü kapat</button>
</div>
</div>
</body></html>
