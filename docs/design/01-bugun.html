<!doctype html>
<!-- Referans tasarım (tasarım tuvalinden çıkarıldı; fontlar Google Fonts üzerinden). -->
<html lang="tr"><head><meta charset="utf-8"><title>Bugün</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>body{margin:0}
a{color:#1B2420}a:hover{color:#C2461C}</style></head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4EE; color: #1B2420; font-family: 'Figtree', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 56px 24px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 14px; color: #5B6560; font-weight: 500">11 Ekim, Pazar</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.5px">Bugün</h1>
</div>
<div style="margin: 0 24px; padding: 16px; background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 15px; font-weight: 600">4 işten 1'i tamam</div>
<div style="font-size: 13px; color: #5B6560">Sıradaki: 10:00</div>
</div>
<div style="height: 8px; background: #E4E6DE; border-radius: 4px; overflow: hidden">
<div style="width: 25%; height: 8px; background: {{accent}}; border-radius: 4px"></div>
</div>
</div>
<div style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 600; color: #5B6560; letter-spacing: 1px">SABAH</div>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: #FFFFFF; border-radius: 16px; opacity: 0.7">
<div style="width: 46px; font-size: 14px; font-weight: 600; color: #5B6560">08:30</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 16px; font-weight: 500; text-decoration: line-through">Kahvaltı ve ilaç</div>
<div style="font-size: 13px; color: #2F6F62; font-weight: 600">Tamamlandı</div>
</div>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F6F62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
</div>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 0 0 2px {{accent}}">
<div style="width: 46px; font-size: 14px; font-weight: 600">10:00</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 16px; font-weight: 500">Maç izle</div>
<div style="font-size: 13px; color: #C2461C; font-weight: 600">25 dk sonra · 2 saat</div>
</div>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6560" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle></svg>
</div>
<div style="font-size: 12px; font-weight: 600; color: #5B6560; letter-spacing: 1px; margin-top: 8px">ÖĞLEDEN SONRA</div>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: #FFFFFF; border-radius: 16px">
<div style="width: 46px; font-size: 14px; font-weight: 600">15:30</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 16px; font-weight: 500">Market alışverişi</div>
<div style="font-size: 13px; color: #5B6560">45 dk</div>
</div>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6560" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle></svg>
</div>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: #FFFFFF; border-radius: 16px">
<div style="width: 46px; font-size: 14px; font-weight: 600; color: #5B6560">—</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 16px; font-weight: 500">Annemi ara</div>
<div style="font-size: 13px; color: #5B6560">Saat yok · gün içinde</div>
</div>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6560" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle></svg>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 32px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<button type="button" aria-label="Gününü anlat, kayda başla" style="width: 76px; height: 76px; border-radius: 38px; border: none; background: {{accent}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(194,70,28,0.32); cursor: pointer">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
</button>
<div style="font-size: 14px; font-weight: 600">Gününü anlat</div>
</div>
</div>
</body></html>
